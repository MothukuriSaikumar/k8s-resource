apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
  namespace: roboshop
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:             # this is the pod template
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - protocol: TCP
          port: 80 # service port
          targetPort: 80 # container port

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-clusterip
  namespace: roboshop
spec:
  selector:
    purpose: nginx
    project: roboshop
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

