apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deployment
  namespace: roboshop
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:             # this is the pod template
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
     

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
  namespace: roboshop
spec:
  clusterIP: None
  selector:
    purpose: nginx
    project: roboshop
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

