apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
  namespace: roboshop
  labels:
    app: nginx
    purpose: statefulset-demo
    project: roboshop
spec:
  clusterIP: None
  selector:
    app: nginx
    purpose: statefulset-demo
  ports:
    - name: web
      port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statefulset-demo
  namespace: roboshop
  labels:
    app: nginx
    purpose: statefulset-demo
    project: roboshop

spec:
  serviceName: nginx-headless
  replicas: 3

  selector:
    matchLabels:
      app: nginx
      purpose: statefulset-demo

  template:
    metadata:
      labels:
        app: nginx
        purpose: statefulset-demo
        project: roboshop

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - name: web
              containerPort: 80

          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html

  volumeClaimTemplates:
    - metadata:
        name: www
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ebs-roboshop
        resources:
          requests:
            storage: 1Gi